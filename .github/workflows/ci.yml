name: CI Telemetry & Link Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily health-check at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-links:
    name: Validate Binary Download Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Deep Link Validator
        run: |
          python3 scripts/deep_link_validator.py

  shellcheck:
    name: Lint Bash Installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
